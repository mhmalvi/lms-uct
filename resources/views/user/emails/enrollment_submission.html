<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <title>Enrollment Submission - UCT</title>

        <style>
            body {
                margin: 0;
            }

            .container-wrapper {
                background: #dfdfdf;
                display: flex;
                justify-content: center;
            }

            .container {
                background-color: #fff;
                width: 560px;
                margin: 20px 0;
                border-radius: 4px;
                box-shadow: 0 2px 5px 1px #ddd;
                overflow: hidden;
            }

            * {
                font-family: "Roboto", sans-serif;
            }

            .text-center {
                text-align: center;
            }

            .row {
                margin-left: 20px;
                margin-right: 20px;
                padding-top: 10px;
                padding-bottom: 10px;
            }

            .row-fluid {
                margin-left: 0;
                margin-right: 0;
                padding-left: 20px;
                padding-right: 20px;
            }

            .submission-item > .question {
                font-weight: bold;
            }

            .footer {
                background-color: #92241d;
                color: #fff;
            }

            .fluid-p {
                margin-top: 0;
                margin-bottom: 0;
            }
        </style>
    </head>

    <body>
        <div class="container-wrapper">
            <div class="container">
                <h3 class="text-center">UCT Enrollment Form Submission</h3>
                <hr />

                <div class="row">
                    <!-- This is a submission item -->
                    <div class="submission-item">
                        <p class="question">Q:</p>
                        <p class="answer"></p>
                    </div>
                    <!-- End of the submission item -->
                </div>

                <div class="row row-fluid footer">
                    <p class="text-center fluid-p">copyright @UCT</p>
                </div>
            </div>
        </div>
    </body>
</html>
